name: SiNamaTV
options:
  bundleIdPrefix: com.vamirreza
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  SiNamaTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources/Fonts
      - path: Resources/tvOS
      - path: Resources/Shared
    dependencies:
      - target: SiNamaTopShelf
        embed: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "سی‌نما TV"
        CFBundleURLTypes:
          - CFBundleURLName: com.vamirreza.sinama.tv
            CFBundleURLSchemes: [sinama]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Filled in from Config/Secrets.xcconfig (git-ignored).
        APIKey: "$(API_KEY)"
        TVTopShelfImage:
          TVTopShelfPrimaryImage: "Top Shelf Image"
          TVTopShelfPrimaryImageWide: "Top Shelf Image Wide"
        UIAppFonts:
          - Vazirmatn-Regular.ttf
          - Vazirmatn-Medium.ttf
          - Vazirmatn-SemiBold.ttf
          - Vazirmatn-Bold.ttf
          - Vazirmatn-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vamirreza.sinama.tv
        # The app group needs a paid team on a real device; see Config/Base.xcconfig.
        CODE_SIGN_ENTITLEMENTS: Config/SiNamaTV.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=appletvos*]": "$(TV_DEVICE_ENTITLEMENTS)"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  SiNamaTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: Sources/Core/TopShelfStore.swift
    info:
      path: Config/Info-TopShelf.plist
      properties:
        CFBundleDisplayName: "سی‌نما TV"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ContentProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vamirreza.sinama.tv.topshelf
        CODE_SIGN_ENTITLEMENTS: Config/SiNamaTopShelf.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=appletvos*]": "$(SHELF_DEVICE_ENTITLEMENTS)"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
  SiNamaPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Fonts
      - path: Resources/iOS
      - path: Resources/Shared
    info:
      path: Config/Info-iOS.plist
      properties:
        CFBundleDisplayName: "سی‌نما"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Filled in from Config/Secrets.xcconfig (git-ignored).
        APIKey: "$(API_KEY)"
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Vazirmatn-Regular.ttf
          - Vazirmatn-Medium.ttf
          - Vazirmatn-SemiBold.ttf
          - Vazirmatn-Bold.ttf
          - Vazirmatn-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vamirreza.sinama.phone
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SiNamaTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: SiNamaTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vamirreza.sinama.tv.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  SiNamaPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITestsPhone
    dependencies:
      - target: SiNamaPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vamirreza.sinama.phone.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SiNamaTV:
    build:
      targets:
        SiNamaTV: all
    test:
      targets:
        - SiNamaTVUITests
    run:
      config: Debug
    archive:
      config: Release
  SiNamaPhone:
    build:
      targets:
        SiNamaPhone: all
    test:
      targets:
        - SiNamaPhoneUITests
    run:
      config: Debug
    archive:
      config: Release
