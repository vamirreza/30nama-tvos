name: SiNamaTV
options:
  bundleIdPrefix: com.vamirreza
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  SiNamaTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "سی‌نما TV"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Filled in from Config/Secrets.xcconfig (git-ignored).
        APIKey: "$(API_KEY)"
        TVTopShelfImage:
          TVTopShelfPrimaryImage: "Top Shelf Image"
          TVTopShelfPrimaryImageWide: "Top Shelf Image Wide"
        UIAppFonts:
          - Vazirmatn-Regular.ttf
          - Vazirmatn-Medium.ttf
          - Vazirmatn-SemiBold.ttf
          - Vazirmatn-Bold.ttf
          - Vazirmatn-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vamirreza.sinama.tv
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  SiNamaTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: SiNamaTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vamirreza.sinama.tv.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SiNamaTV:
    build:
      targets:
        SiNamaTV: all
    test:
      targets:
        - SiNamaTVUITests
    run:
      config: Debug
    archive:
      config: Release
